<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu Mod</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <!-- FLOATING STATUS -->
    <div class="debug-status-float">
	  <div class="status-pill off" id="floatShizuku">SHIZUKU: OFF</div>
    </div>

    <!-- HEADER -->
    <div class="header">
	  <div class="video-container">
		<video autoplay loop muted playsinline>
		  <source src="file:///android_asset/anime.mp4" type="video/mp4">
		</video>
	  </div>
	  <div class="comic-bubble">MOD</div>
    </div>

    <!-- BANNER -->
    <div class="app-banner-wrapper">
	  <div class="app-banner">
		<span class="app-name">INY PROXY</span>
		<span class="app-sub">Debugging</span>
	  </div>
    </div>

    <!-- MENU LIST -->
    <div class="menu-list">

	  <!-- DEBUGGING SETTINGS -->
	  <div class="menu-item full-width" style="background:#fdf2f2;border-color:#e74c3c;margin-top:10px;">
		<div class="menu-info">
		  <span class="menu-title" style="color:#c0392b;">Service Status</span>
		</div>
	  </div>

	  <div class="menu-item" onclick="openShizuku()">
		<div class="menu-info">
		  <span class="menu-title">Shizuku Service</span>
		  <span class="menu-desc">Buka aplikasi Shizuku</span>
		</div>
		<div class="menu-right">
		  <span class="menu-status scan" id="statusShizuku">SET</span>
		</div>
	  </div>

	  <!-- TAMBAH GAME -->
	  <div class="menu-item full-width" onclick="openAddGameModal()" style="margin-top:15px;background:#f0f9ff;border-color:#3498db;">
		<div class="menu-info">
		  <span class="menu-title" style="color:#2980b9;">📥 Tambah Game Debug</span>
		</div>
		<div class="menu-right">
		  <span class="menu-status on" id="statusAddGame">ADD</span>
		</div>
	  </div>

    </div>

    <!-- DAFTAR GAME USER -->
    <div class="game-section-wrapper">
	  <div class="game-section-header">
		<div class="game-section-title">
		  <span class="title-text">Game Terdaftar</span>
		  <span class="title-badge" id="gameCount">0</span>
		</div>
		<div class="game-section-action">
		  <button class="btn-refresh-games" onclick="refreshUserGames()">🔄</button>
		</div>
	  </div>
	  <div class="game-grid" id="userGameList">
		<div class="game-empty-state">
		  <span class="empty-icon">🎯</span>
		  <p class="empty-title">Belum Ada Game</p>
		  <p class="empty-desc">Klik <strong>"Tambah Game"</strong> untuk menambahkan</p>
		</div>
	  </div>
    </div>

    <!-- START GAME -->
    <div class="start-container">
	  <button class="btn-start" onclick="startGame()">🎮 LANJUTKAN</button>
    </div>

    <!-- FOOTER -->
    <div class="developer-footer">
	  <span>✦</span> Developed by INY PROXY <span>✦</span><br>
	  © 2026 All Rights Reserved
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- MODAL ADD GAME -->
    <div class="modal-overlay" id="addGameModal">
	  <div class="modal-content">
		<button class="modal-close" onclick="closeAddGameModal()">✕</button>
		<h2>📥 Tambah Game</h2>
		<div id="gameScanResult"><p style="text-align:center;color:#999;font-size:13px;">🔍 Scanning game...</p></div>
	  </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
